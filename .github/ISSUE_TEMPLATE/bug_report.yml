name: Bug report
description: Report a BrainForge problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Share commands and non-sensitive fixture shapes.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
  - type: textarea
    id: safety
    attributes:
      label: Privacy Or Safety Impact
      description: Did this involve raw exports, generated memory, config files, or MCP access?
